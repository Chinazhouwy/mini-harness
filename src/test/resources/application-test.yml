#    com.chinazhouwy.miniharness.harness: INFO

finance:
  research:
    # 真实数据接口；测试通过构造 FixtureMarketResearchDataSource，不读取这里的网络配置。
    lookback-days: 420
    cache-seconds: 900

# 页面和 Fixture API 无需模型凭据；模型侧由 AgentScope + 环境变量配置（见 FirstAgent）。

logging:
  level:
    io.agentscope.harness.agent.workspace.WorkspaceManager: ERROR   # 缺 AGENTS.md 的 WARN 不看
    io.agentscope.core.tool.Toolkit: ERROR                          # 注册工具那一串 INFO 不看
    io.agentscope.harness.agent.HarnessAgent: ERROR                 # 构建信息不看
    io.agentscope.core.model.transport.JdkHttpTransport: WARN
    io.agentscope.harness.agent.middleware.AgentTraceMiddleware: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %msg%n"