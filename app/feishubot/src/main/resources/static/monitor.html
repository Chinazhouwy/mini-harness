<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feishubot · Mission Control</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1019;
  --panel: #111a27;
  --line: #2b3b50;
  --text: #eeeadd;
  --muted: #9caec4;
  --dim: #74869e;
  --green: #a3dfb6;
  --cyan: #89d9ed;
  --amber: #f1b88c;
  --purple: #c1a8f0;
  --red: #ff9586;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 14px;
  color: var(--text);
  background: radial-gradient(ellipse at 50% 0, #29394d, #0b111b 75%);
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;
}
button, input { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); }
button { cursor: pointer; border-radius: 5px; padding: 7px 12px; transition: background .18s, border-color .18s; }
button:disabled { opacity: .4; cursor: default; }
button:hover:not(:disabled) { border-color: var(--cyan); background: #89d9ed0d; }
button.on { color: var(--cyan); border-color: #89d9ed55; background: #89d9ed0c; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.shell {
  height: calc(100dvh - 28px);
  min-height: 760px;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  border: 1px solid #586a7e;
  border-radius: 14px;
  overflow: hidden;
  background: var(--bg);
  box-shadow: 0 0 0 3px #202c3b, 0 0 0 4px #354459, 0 22px 70px #0006;
}
.sidebar { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: linear-gradient(180deg, #182333, #0d1420 65%); }
.brand { height: 96px; padding: 22px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 37px; height: 37px; display: grid; place-items: center; color: var(--amber); border: 1px solid #f1b88c66; border-radius: 50%; font-size: 25px; box-shadow: inset 0 0 16px #f1b88c0c, 0 0 18px #f1b88c09; }
.brand b { display: block; font-size: 19px; letter-spacing: -1px; }
.brand small { color: var(--muted); font-size: 9px; letter-spacing: 2px; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 18px 12px; color: var(--muted); font-size: 10px; letter-spacing: 1.5px; }
.count { color: var(--amber); font-variant-numeric: tabular-nums; }
.search { margin: 0 12px 14px; width: calc(100% - 24px); padding: 10px; border-radius: 5px; background: #090f19; font-size: 10px; }
.search::placeholder { color: var(--dim); }
.traces { flex: 1; min-height: 0; overflow: auto; padding: 0 9px; }
.trace { width: 100%; text-align: left; padding: 13px 11px; border-color: transparent; margin-bottom: 5px; display: block; }
.trace.on { background: linear-gradient(90deg, #26435685, #152231); border-color: #89d9ed38; box-shadow: inset 2px 0 var(--cyan); color: var(--text); }
.trace-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.trace-top b { font-weight: 500; flex: 1; font-size: 11px; }
.trace-top time { color: var(--dim); font-size: 9px; }
.trace-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d2d9e2; font-size: 12px; }
.trace-meta { display: block; margin-top: 6px; color: var(--dim); font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: 6px; height: 6px; display: inline-block; border-radius: 50%; background: var(--cyan); flex-shrink: 0; }
.status-dot.done { background: var(--green); }
.status-dot.error { background: var(--red); }
.side-foot { border-top: 1px solid var(--line); margin-top: 12px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 9px; color: var(--dim); }
.connection { display: flex; align-items: center; gap: 7px; }
.connection[data-state="connected"] { color: var(--green); }
.connection[data-state="error"] { color: var(--red); }
.connection .status-dot { background: currentColor; box-shadow: 0 0 8px currentColor; }
.main { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; grid-template-rows: 96px auto auto minmax(0, 1fr) 28px; background: linear-gradient(150deg, #15213188, transparent 45%); }
.header, .toolbar, .footer { grid-column: 1 / -1; }
.header { min-height: 96px; flex-shrink: 0; border-bottom: 1px solid var(--line); padding: 17px 25px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.eyebrow { color: var(--dim); letter-spacing: 2px; font-size: 9px; margin-bottom: 6px; }
h1 { margin: 0; font-size: 25px; font-weight: 500; letter-spacing: -1px; }
.header-right { display: flex; align-items: center; gap: 18px; }
.clock-label { color: var(--muted); font-size: 8px; letter-spacing: 1.5px; margin-bottom: 5px; }
.clock { position: relative; width: 220px; height: 46px; padding: 6px 10px; color: #ff9879; background: #080c12; border: 1px solid #5a4339; border-radius: 5px; box-shadow: inset 0 2px 9px #000, 0 1px 0 #ffffff0a; }
.clock svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 3px #ff987958); }
.clock-value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.run-state { color: var(--cyan); border: 1px solid #89d9ed4d; border-radius: 4px; padding: 7px 11px; font-size: 10px; letter-spacing: 1px; background: #89d9ed08; white-space: nowrap; }
.run-state::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 7px; background: currentColor; box-shadow: 0 0 8px currentColor; }
.run-state[data-state="done"] { color: var(--green); border-color: #a3dfb64d; background: #a3dfb608; }
.run-state[data-state="error"] { color: var(--red); border-color: #ff95864d; background: #ff958608; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 12px 25px; }
.toolbar button { font-size: 10px; }
.toolbar .trace-id { margin-left: auto; color: var(--dim); font-size: 9px; }
.overview { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 90px); border-bottom: 1px solid var(--line); margin: 0 25px 14px; }
.mission { padding: 5px 0 14px; min-width: 0; }
.mission-title { font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin: 5px 0; }
.session { font-size: 9px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.metric { border-left: 1px solid var(--line); margin: 3px 0 14px; padding: 0 15px; display: flex; flex-direction: column; justify-content: center; }
.metric span { color: var(--dim); font-size: 9px; letter-spacing: 1px; }
.metric b { color: var(--text); font-size: 23px; font-weight: 400; font-variant-numeric: tabular-nums; }
.metric:last-child b { color: var(--red); }
.workspace { grid-column: 1; grid-row: 4; flex: 1; min-height: 0; margin: 0 25px 14px; display: flex; flex-direction: column; gap: 12px; }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: #101926; }
.panel-head { height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 13px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, #20304455, transparent); }
.panel-head h2 { font-size: 10px; letter-spacing: 1.5px; font-weight: 500; margin: 0; color: #c9d3df; }
.panel-head h2::before { content: '⌜'; color: var(--amber); margin-right: 7px; }
.panel-head span { font-size: 9px; color: var(--dim); }
.workspace > .panel:first-child { flex-shrink: 0; }
.workspace > .panel:first-child .panel-head { display: none; }
.workspace > .panel:last-child { flex: 1; }
.roles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 5px; gap: 4px; }
.role { position: relative; min-width: 0; text-align: left; border-color: transparent; padding: 9px 7px; border-radius: 4px; }
.role::after { content: ''; position: absolute; bottom: 0; left: 7px; right: 7px; height: 2px; background: var(--line); }
.role.active { border-color: color-mix(in srgb, var(--node-color) 35%, transparent); background: color-mix(in srgb, var(--node-color) 7%, transparent); }
.role.active::after { background: var(--node-color); box-shadow: 0 0 8px var(--node-color); }
.role.done::after { background: color-mix(in srgb, var(--node-color) 50%, transparent); }
.role.error::after { background: var(--red); }
.role-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 1px 5px; align-items: center; }
.role-icon { grid-row: 1 / 3; font-size: 20px; color: var(--node-color); }
.role-name { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role-state { grid-column: 2; color: var(--dim); font-size: 8px; }
.role.active .role-state { color: var(--node-color); }
.role.error .role-state { color: var(--red); }
.role-meta { display: none; }
.flow-wrap { position: relative; isolation: isolate; flex: 1; min-height: 0; overflow: auto; background-color: #0c1420; background-image: radial-gradient(ellipse at 50% 45%, #2a425b40, transparent 65%), linear-gradient(#47617b12 1px, transparent 1px), linear-gradient(90deg, #47617b12 1px, transparent 1px), radial-gradient(#6e8cae50 .7px, transparent .7px); background-size: 100% 100%, 72px 72px, 72px 72px, 18px 18px; }
.flow-wrap::after { content: ''; position: sticky; display: block; height: 0; bottom: 0; left: 0; width: 100%; box-shadow: 0 -15px 35px 10px #0c1420; pointer-events: none; }
.flow { display: block; width: 100%; min-width: 600px; }
.flow-empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--dim); gap: 10px; }
.flow-empty::before { content: '◎'; font-size: 62px; line-height: 1.5; color: #89d9ed42; text-shadow: 0 0 32px #89d9ed1c; }
.flow-empty b { color: var(--muted); font-size: 14px; font-weight: 400; }
.flow-empty span { font-size: 11px; }
.edge { fill: none; stroke: var(--edge-color); stroke-opacity: .35; stroke-width: 1.3; marker-end: url(#arrow); }
.edge.live { stroke-opacity: .6; }
.edge-trail { fill: none; stroke: var(--edge-color); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 10 90; filter: drop-shadow(0 0 4px var(--edge-color)); animation: travel 1.8s linear infinite; }
@keyframes travel { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.edge-port { cursor: pointer; color: var(--cyan); outline: none; }
.edge-port.output { color: var(--amber); }
.edge-port circle { fill: #101c2b; stroke: currentColor; stroke-opacity: .7; }
.edge-port .port-hit { fill: transparent; stroke: none; }
.edge-port path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.edge-port text { fill: currentColor; font-size: 8px; paint-order: stroke; stroke: #0c1420; stroke-width: 4px; }
.edge-port:hover circle, .edge-port:focus-visible circle, .edge-port.selected circle { stroke-opacity: 1; fill: #293d50; filter: drop-shadow(0 0 4px currentColor); }
.edge-trail, .edge-label { pointer-events: none; }
.edge-label { fill: var(--muted); font-size: 9px; paint-order: stroke; stroke: #0c1420; stroke-width: 5px; stroke-linejoin: round; }
.node { cursor: pointer; outline: none; color: var(--node-color); }
.node-ticks { fill: none; stroke: currentColor; stroke-opacity: .23; stroke-width: 2; stroke-dasharray: 1 11; }
.node-track { fill: none; stroke: currentColor; stroke-opacity: .13; stroke-width: 1; }
.node-orbit { fill: none; stroke: currentColor; stroke-opacity: .5; stroke-width: 1.5; stroke-dasharray: 20 80; transform-box: fill-box; transform-origin: center; transform: rotate(-90deg); }
.node-halo { fill: currentColor; opacity: .03; }
.node-ring { fill: #111f30; stroke: currentColor; stroke-opacity: .5; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; }
.node.active .node-ring { stroke-opacity: 1; filter: drop-shadow(0 0 9px currentColor); animation: breathe 1.8s ease-in-out infinite; }
.node.active .node-halo { animation: halo 1.8s ease-in-out infinite; }
.node.active .node-orbit { stroke-opacity: 1; animation: orbit 6s linear infinite; }
.node.done .node-orbit { stroke-dasharray: 100; stroke-opacity: .6; }
.node.error { color: var(--red); }
.node.selected .node-track, .node:hover .node-track, .node:focus-visible .node-track { stroke: var(--text); stroke-opacity: .9; stroke-width: 1.5; }
.node.selected .node-ring { fill: #1e3045; }
@keyframes breathe { 0%, 100% { transform: scale(.95); } 50% { transform: scale(1.05); } }
@keyframes halo { 0%, 100% { opacity: .03; } 50% { opacity: .1; } }
@keyframes orbit { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
.node-icon { fill: currentColor; font-size: 29px; }
.node-title { fill: var(--text); font-size: 12px; }
.node-meta { fill: var(--dim); font-size: 9px; }
.node-state { fill: currentColor; font-size: 9px; letter-spacing: 1px; }
.node.done .node-state { fill: var(--green); }
.flow-foot { padding: 8px 13px; border-top: 1px solid var(--line); color: var(--dim); font-size: 9px; display: flex; justify-content: space-between; gap: 12px; }
.legend { display: flex; gap: 13px; }
.legend i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--green); margin-right: 5px; }
.legend i.cyan { background: var(--cyan); }
.legend i.red { background: var(--red); }
.lower { grid-column: 2; grid-row: 3 / 5; min-height: 0; margin: 0 18px 14px 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; }
.log { flex: 1; min-height: 0; overflow: auto; padding: 5px 0; background: #0d1520; }
.log-line { width: 100%; display: flex; align-items: baseline; gap: 10px; text-align: left; border: 0; border-radius: 0; padding: 5px 13px; white-space: nowrap; }
.log-line.selected { background: #f1b88c0b; box-shadow: inset 2px 0 var(--amber); }
.log-line time { color: var(--dim); font-size: 9px; flex-shrink: 0; }
.log-type { color: var(--muted); font-size: 9px; width: 92px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
.log-type.advance { color: var(--green); }
.log-type.error { color: var(--red); }
.log-type.sub { color: var(--purple); }
.log-name { font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
.log-status { color: var(--dim); margin-left: auto; font-size: 9px; flex-shrink: 0; }
.inspector { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; background: #0d1520; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 6px 15px; margin-bottom: 12px; color: var(--muted); font-size: 10px; word-break: break-all; }
.detail-meta b { font-weight: 400; color: var(--dim); margin-right: 7px; }
.detail-label { color: var(--amber); font-size: 9px; letter-spacing: 1px; margin: 13px 0 6px; }
pre { margin: 0; color: #c9d4e1; font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { padding: 22px 14px; color: var(--dim); font-size: 11px; }
.error-message { color: var(--red); }
.footer { height: 28px; padding: 0 25px; flex-shrink: 0; display: flex; justify-content: space-between; gap: 12px; font-size: 9px; color: var(--dim); border-top: 1px solid var(--line); align-items: center; background: #101a27; }
.footer #notice { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dialog { width: min(960px, 94vw); max-height: 86dvh; padding: 0; background: var(--panel); color: var(--text); border: 1px solid #52627a; border-radius: 9px; box-shadow: 0 24px 100px #0009; }
.dialog::backdrop { background: #050a12b8; backdrop-filter: blur(4px); }
.dialog-head { padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.dialog-head b { flex: 1; font-weight: 500; font-size: 12px; }
.dialog-head button { padding: 4px 10px; font-size: 10px; }
.dialog-body { padding: 18px; overflow: auto; max-height: calc(86dvh - 65px); }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #3d5068; border-radius: 5px; }
@media (min-width: 1600px) { .shell { grid-template-columns: 260px minmax(0, 1fr); } .main { grid-template-columns: minmax(0, 1fr) 340px; } }
@media (max-width: 1150px) {
  .shell { height: auto; grid-template-columns: 210px minmax(0, 1fr); min-height: 850px; }
  .main { display: flex; flex-direction: column; }
  .workspace > .panel:last-child { flex: none; height: 400px; }
  .lower { height: 210px; flex-shrink: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
  .header, .toolbar { padding-left: 18px; padding-right: 18px; }
  .overview, .workspace, .lower { margin-left: 18px; margin-right: 18px; }
  .overview { grid-template-columns: minmax(0, 1fr) repeat(3, 68px); }
  .metric { padding: 0 10px; }
  .roles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .log-type { width: 95px; }
  .clock { width: 180px; height: 42px; }
  .run-state { font-size: 9px; padding: 6px; }
}
@media (max-width: 850px) {
  body { padding: 8px; }
  .shell { height: auto; min-height: calc(100dvh - 16px); grid-template-columns: 1fr; }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { height: 65px; padding: 13px 18px; }
  .side-head { padding: 12px 18px; }
  .search { margin-bottom: 8px; }
  .traces { max-height: 150px; }
  .side-foot { display: none; }
  .header { min-height: 90px; }
  .workspace > .panel:last-child { min-height: 380px; }
  .lower { height: auto; grid-template-columns: 1fr; }
  .lower > .panel { height: 250px; }
  .toolbar .trace-id { display: none; }
  .overview { grid-template-columns: repeat(3, 1fr); }
  .mission { grid-column: 1 / -1; }
  .metric { border-left: 0; }
  .metric + .metric { border-left: 1px solid var(--line); }
  .header-right { gap: 10px; }
  .footer span:last-child { display: none; }
}
@media (max-width: 480px) {
  h1 { font-size: 19px; }
  .run-state { display: none; }
  .clock { width: 135px; height: 36px; padding: 4px 7px; }
  .clock-label { font-size: 7px; letter-spacing: 0; }
  .roles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow-foot > span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="历史任务" data-i18n-aria-label="历史任务">
    <div class="brand"><span class="brand-mark" aria-hidden="true">⌁</span><div><b>feishubot</b><small data-i18n="任务监控">任务监控</small></div></div>
    <div class="side-head"><span data-i18n="历史任务">历史任务</span><span id="traceCount" class="count">00</span></div>
    <input id="search" class="search" type="search" placeholder="搜索消息 / 链路 / 会话" data-i18n-placeholder="搜索消息 / 链路 / 会话" aria-label="搜索历史任务" data-i18n-aria-label="搜索历史任务">
    <div id="traces" class="traces"><div class="empty" data-i18n="正在读取事件记录…">正在读取事件记录…</div></div>
    <div class="side-foot"><span id="connection" class="connection" data-state="connecting"><i class="status-dot"></i><span id="connectionText">连接中</span></span><span>SSE / JSONL</span></div>
  </aside>
  <main class="main">
    <header class="header">
      <div><div class="eyebrow" data-i18n="智能体运行监控">智能体运行监控</div><h1 data-i18n="任务控制台">任务控制台</h1></div>
      <div class="header-right"><div><div class="clock-label" data-i18n="任务耗时">任务耗时</div><div class="clock"><span id="elapsed" class="clock-value">00:00:00</span><svg id="clockDisplay" viewBox="0 0 254 52" aria-hidden="true"></svg></div></div><span id="runState" class="run-state" data-state="idle">WAITING</span></div>
    </header>
    <div class="toolbar">
      <button id="followBtn" class="on" aria-pressed="true">● 跟随最新</button>
      <button id="refreshBtn" data-i18n="↻ 刷新列表">↻ 刷新列表</button>
      <button id="replayBtn" disabled>▷ 回放当前</button>
      <button id="languageBtn" aria-label="切换到英文">English</button>
      <span id="traceId" class="trace-id">TRACE —</span>
    </div>
    <section class="overview" aria-label="当前任务概览" data-i18n-aria-label="当前任务概览">
      <div class="mission"><div class="eyebrow" data-i18n="当前任务">当前任务</div><div id="missionTitle" class="mission-title" data-i18n="等待飞书消息">等待飞书消息</div><div id="session" class="session">SESSION —</div></div>
      <div class="metric"><span data-i18n="事件数">事件数</span><b id="sEvents">0</b></div>
      <div class="metric"><span data-i18n="工具调用">工具调用</span><b id="sTools">0</b></div>
      <div class="metric"><span data-i18n="错误数">错误数</span><b id="sErrors">0</b></div>
    </section>
    <div class="workspace">
      <section class="panel"><div class="panel-head"><h2 data-i18n="执行阶段">执行阶段</h2><span id="roleCount">0 / 7</span></div><div id="roles" class="roles"></div></section>
      <section class="panel">

        : 'M' + x1 + ',' + y1 + ' H' + x2;
      const edgeStyle = '--edge-color:' + (node.state === 'error' ? 'var(--red)' : role.color);
      $('edges').append(svgElement('path', {d:path, class:'edge' + (node.state === 'active' ? ' live' : ''), style:edgeStyle}));
      if (node.state === 'active') $('edges').append(svgElement('path', {d:path, class:'edge-trail', pathLength:100, style:edgeStyle + ';animation-delay:-' + phase + 'ms'}));
      const toTool = previous.role === 'model' && (node.role === 'tool' || node.role === 'web');
      const toModel = (previous.role === 'tool' || previous.role === 'web' || previous.role === 'sub') && node.role === 'model';
      if (toTool || toModel) $('edges').append(svgElement('text', {x:down ? gutter - direction * 6 : (x1 + x2) / 2, y:down ? (y1 + y2) / 2 + 24 : y1 - 10, class:'edge-label', 'text-anchor':down ? (direction === 1 ? 'end' : 'start') : 'middle'}, tr(toTool ? '执行工具' : '返回结果')));
      for (const port of [
        {node:previous, direction:'output', x:x1 + direction * 10, y:y1, angle:direction === 1 ? 0 : 180},
        {node, direction:'input', x:x2 + (down ? direction : -direction) * 8, y:y2, angle:(down ? -direction : direction) === 1 ? 0 : 180}
      ]) {
        const event = port.node.events[port.node.events.length - 1];
        const name = tr(port.direction === 'input' ? '入参' : '出参');
        const selected = selectedDirection === port.direction && port.node.events.some(e => e.eventId === selectedEvent?.eventId);
        const arrow = svgElement('g', {class:'edge-port ' + port.direction + (selected ? ' selected' : ''), transform:'translate(' + port.x + ',' + port.y + ')', tabindex:'0', role:'button', 'aria-label':tr(port.node.name) + ' · ' + name});
        arrow.append(svgElement('circle', {r:14, class:'port-hit'}));
        arrow.append(svgElement('circle', {r:9}));
        arrow.append(svgElement('path', {d:'M-3,-4 L2,0 L-3,4', transform:'rotate(' + port.angle + ')'}));
        arrow.append(svgElement('text', {x:0, y:23, 'text-anchor':'middle'}, name));
        arrow.append(svgElement('title', {}, tr(port.node.name) + ' · ' + name));
        arrow.onclick = () => selectEvent(event, port.direction);
        arrow.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectEvent(event, port.direction); } };
        $('edges').append(arrow);
      }
    }
    const selected = node.events.some(e => e.eventId === selectedEvent?.eventId);
    const group = svgElement('g', {class:'node ' + node.state + (selected ? ' selected' : ''), style:'--node-color:' + role.color, tabindex:'0', role:'button', 'aria-label':tr(node.name) + ' · ' + stateText(node.state)});
    // 使用同一时钟相位，流式重绘不会让呼吸和连线光点反复从头开始。
    group.append(svgElement('circle', {cx:centerX, cy:centerY, r:78, class:'node-track'}));
    group.append(svgElement('circle', {cx:centerX, cy:centerY, r:73, class:'node-ticks'}));
    group.append(svgElement('circle', {cx:centerX, cy:centerY, r:65, class:'node-orbit', pathLength:100, style:'animation-delay:-' + Date.now() % 6000 + 'ms'}));
    group.append(svgElement('circle', {cx:centerX, cy:centerY, r:60, class:'node-halo', style:'animation-delay:-' + phase + 'ms'}));
    group.append(svgElement('circle', {cx:centerX, cy:centerY, r:51, class:'node-ring', style:'animation-delay:-' + phase + 'ms'}));
    group.append(svgElement('text', {x:centerX, y:centerY - 3, class:'node-icon', 'text-anchor':'middle', 'aria-hidden':'true'}, role.icon));
    group.append(svgElement('text', {x:centerX, y:centerY + 22, class:'node-state', 'text-anchor':'middle'}, stateText(node.state)));
    const name = tr(node.name);
    const labelLimit = language === 'en' ? 24 : 16;
    const label = name.length > labelLimit ? name.slice(0, labelLimit - 1) + '…' : name;
    const last = node.events[node.events.length - 1];
    const elapsed = hasValue(last.durationMs) ? ' · ' + last.durationMs + ' ms' : '';
    group.append(svgElement('text', {x:centerX, y:centerY + 100, class:'node-title', 'text-anchor':'middle'}, label));
    group.append(svgElement('text', {x:centerX, y:centerY + 118, class:'node-meta', 'text-anchor':'middle'}, tr(role.name) + elapsed));
    group.append(svgElement('title', {}, name + ' · ' + eventLabel(last.eventType)));
    group.onclick = () => selectEvent(last);
    group.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectEvent(last); } };
    $('nodes').append(group);
  });
  if (atBottom) wrap.scrollTop = wrap.scrollHeight;
  $('flowPhase').textContent = nodes.length ? nodes.length + ' ' + tr('节点') + ' / ' + (replayTimer ? tr('回放中') : stateText(traceState(currentEvents))) : tr('等待事件');
}
function renderRoles() {
  const touched = new Set(currentEvents.map(roleOf).filter(Boolean));
  $('roleCount').textContent = touched.size + ' / ' + roles.length;
  $('roles').innerHTML = roles.map(role => {
    const last = currentEvents.findLast(e => roleOf(e) === role.id);
    const related = nodes.filter(n => n.role === role.id);
    const state = last ? isError(last) ? 'error' : related.some(n => n.state === 'active') ? 'active' : 'done' : 'idle';
    return '<button class="role ' + state + '" style="--node-color:' + role.color + '" data-role="' + role.id + '"><span class="role-row"><span class="role-icon">' + role.icon + '</span><span class="role-name">' + tr(role.name) + '</span><span class="role-state">' + tr({idle:'—', active:'运行', done:'已记录', error:'错误'}[state]) + '</span></span><div class="role-meta">' + esc(last ? last.name || eventLabel(last.eventType) : tr(role.hint)) + '</div></button>';
  }).join('');
  $('roles').querySelectorAll('[data-role]').forEach(button => button.onclick = () => {
    const event = currentEvents.findLast(e => roleOf(e) === button.dataset.role);
    if (event) selectEvent(event);
    else setNotice('当前链路尚无「{role}」事件', {role:tr(roles.find(r => r.id === button.dataset.role).name)});
  });
}
function renderLog() {
  const log = $('log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  const offset = Math.max(0, currentEvents.length - 300);
  log.innerHTML = currentEvents.slice(offset).map((event, index) => {
    const type = event.eventType || '';
    const kind = isError(event) ? 'error' : roleOf(event) === 'sub' ? 'sub' : /START|END|SENT|RECEIVED|REPLY|RESULT/.test(type) ? 'advance' : '';
    return '<button class="log-line ' + (event.eventId === selectedEvent?.eventId ? 'selected' : '') + '" data-index="' + (offset + index) + '"><time>' + esc(displayTime(event.ts)) + '</time><span class="log-type ' + kind + '" title="' + esc(type) + '">' + esc(eventLabel(type)) + '</span><span class="log-name">' + esc(event.name || '—') + '</span><span class="log-status">' + esc(statusLabel(event.status)) + '</span></button>';
  }).join('') || '<div class="empty">' + tr('尚无事件') + '</div>';
  log.querySelectorAll('[data-index]').forEach(button => button.onclick = () => selectEvent(currentEvents[Number(button.dataset.index)]));
  if (atBottom) log.scrollTop = log.scrollHeight;
  $('logCount').textContent = currentEvents.length > 300 ? tr('最近 300 / {count}', {count:currentEvents.length}) : currentEvents.length + ' ' + tr('条事件');
}
function detailFor(event) {
  if (event.detail) return event;
  if (roleOf(event) === 'model' && hasValue(event.replyId)) return currentEvents.findLast(e => e.eventType === 'MODEL_CALL_DETAIL' && e.replyId === event.replyId) || event;
  if (hasValue(event.toolCallId)) {
    const matches = currentEvents.filter(e => e.eventType === 'TOOL_CALL_DETAIL' && e.toolCallId === event.toolCallId);
    return matches.findLast(e => e.status !== 'START') || matches[matches.length - 1] || event;
  }
  if (hasValue(event.replyId)) return currentEvents.findLast(e => e.eventType === 'MODEL_CALL_DETAIL' && e.replyId === event.replyId) || event;
  return event;
}
function pretty(value) {
  if (!hasValue(value)) return tr('未记录');
  if (typeof value !== 'string') return JSON.stringify(value, null, 2);
  try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
}
function detailHtml(event) {
  const detail = detailFor(event);
  const rows = [
    ['事件', eventLabel(event.eventType)], ['名称', detail.modelId || detail.name || event.name],
    ['状态', statusLabel(detail.status || event.status)], ['耗时', hasValue(detail.durationMs) ? detail.durationMs + ' ms' : tr('未记录')],
    ['链路', event.traceId], ['会话', event.sessionId], ['回复 ID', detail.replyId], ['工具调用 ID', detail.toolCallId]
  ];
  const inputHtml = '<div class="detail-label">' + tr(selectedDirection ? '入参' : '输入') + '</div><pre>' + esc(pretty(detail.input)) + '</pre>';
  const output = detail.detail ? detail.output : (detail.output ?? event.summary);
  const outputHtml = '<div class="detail-label">' + tr(selectedDirection ? '出参' : '输出 / 摘要') + '</div><pre>' + esc(pretty(output)) + '</pre>';
  const parameters = selectedDirection === 'input' ? inputHtml : selectedDirection === 'output' ? outputHtml : inputHtml + outputHtml;
  return '<div class="detail-meta">' + rows.map(([label, value]) => '<span><b>' + tr(label) + '</b>' + esc(hasValue(value) ? value : '—') + '</span>').join('') + '</div>' + parameters +
    '<div class="detail-label">' + tr('上下文') + '</div><pre>' + esc(pretty({eventType:event.eventType, status:event.status, ts:event.ts, source:event.source, parentSessionId:event.parentSessionId, subagentEvent:event.subagentEvent, subagentSessionId:event.subagentSessionId})) + '</pre>';
}
function renderDetail() {
  $('expandBtn').disabled = !selectedEvent;
  $('inspector').innerHTML = selectedEvent ? detailHtml(selectedEvent) : '<div class="empty">' + tr('选择一个节点、阶段或事件查看调用详情') + '</div>';
  if ($('dialog').open && selectedEvent) $('dialogBody').innerHTML = detailHtml(selectedEvent);
}
function selectEvent(event, direction = null) {
  selectedEvent = event;
  selectedDirection = direction;
  renderDetail(); renderFlow(); renderLog();
}
const clockDigits = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
const clockSegments = {
  a:'4,0 20,0 23,3 20,6 4,6 1,3', b:'24,4 27,7 27,21 24,24 21,21 21,7',
  c:'24,26 27,29 27,43 24,46 21,43 21,29', d:'4,44 20,44 23,47 20,50 4,50 1,47',
  e:'0,26 3,29 3,43 0,46 -3,43 -3,29', f:'0,4 3,7 3,21 0,24 -3,21 -3,7',
  g:'4,22 20,22 23,25 20,28 4,28 1,25'
};
function tickClock() {
  const state = traceState(currentEvents);
  const start = currentEvents.length ? eventTime(currentEvents[0]) : NaN;
  const last = currentEvents.length ? eventTime(currentEvents[currentEvents.length - 1]) : NaN;
  const end = replayTimer || state === 'done' || state === 'error' ? last : Date.now();
  const elapsed = Number.isFinite(start) ? duration(end - start) : '00:00:00';
  $('elapsed').textContent = elapsed;
  const display = $('clockDisplay');
  display.replaceChildren();
  let x = 7;
  for (const character of elapsed) {
    if (character === ':') {
      for (const y of [17, 35]) display.append(svgElement('circle', {cx:x + 1, cy:y, r:2, fill:'currentColor'}));
      x += 14;
    } else {
      const digit = svgElement('g', {transform:'translate(' + x + ',1)'});
      for (const [segment, points] of Object.entries(clockSegments)) digit.append(svgElement('polygon', {points, fill:'currentColor', opacity:clockDigits[Number(character)].includes(segment) ? 1 : .08}));
      display.append(digit);
      x += 36;
    }
  }
  display.setAttribute('viewBox', '0 0 ' + (x + 3) + ' 52');
}
function syncControls() {
  $('followBtn').classList.toggle('on', followLatest);
  $('followBtn').setAttribute('aria-pressed', String(followLatest));
  $('followBtn').textContent = (followLatest ? '● ' : '○ ') + tr('跟随最新');
  $('replayBtn').textContent = replayTimer ? 'Ⅱ ' + tr('停止回放') : '▷ ' + tr('回放当前');
  $('replayBtn').disabled = !currentEvents.length && !replayTimer;
}
function render() {
  nodes = buildNodes(currentEvents);
  renderFlow(); renderRoles(); renderLog(); renderDetail(); tickClock(); syncControls();
  const state = replayTimer ? 'replay' : traceState(currentEvents);
  $('runState').dataset.state = state;
  $('runState').textContent = stateText(state);
  $('missionTitle').textContent = currentEvents.length ? missionOf(currentEvents) : loadingTrace ? tr('正在读取任务…') : tr('等待飞书消息');
  $('missionTitle').title = $('missionTitle').textContent;
  $('session').textContent = tr('会话') + ' ' + (currentEvents[0]?.sessionId || '—');
  $('traceId').textContent = tr('链路') + ' ' + (currentTrace || '—');
  $('sEvents').textContent = currentEvents.length;
  $('sTools').textContent = nodes.filter(n => n.role === 'tool' || n.role === 'web').length;
  $('sErrors').textContent = currentEvents.filter(isError).length;
}
function replay() {
  if (replayTimer) {
    const all = replayEvents;
    stopReplay(); currentEvents = all; render();
    setNotice('回放已停止 · 已恢复完整事件');
    return;
  }
  if (!currentEvents.length || loadingTrace) return;
  followLatest = false;
  replayEvents = currentEvents.slice();
  currentEvents = []; selectedEvent = null; selectedDirection = null;
  let index = 0;
  replayTimer = setInterval(() => {
    currentEvents.push(replayEvents[index++]);
    if (index === replayEvents.length) { stopReplay(); setNotice('回放完成'); }
    else setNotice('回放 {index} / {count}', {index, count:replayEvents.length});
    render();
  }, 160);
  render();
}
function connect() {
  const source = new EventSource('/api/stream');
  source.onopen = () => {
    $('connection').dataset.state = 'connected';
    $('connectionText').textContent = tr('实时连接');
    setNotice('事件流已连接');
    // 重连后补读当前 trace，覆盖断线期间的事件。
    if (followLatest && currentTrace) loadTrace(currentTrace);
    loadRecent();
  };
  source.onmessage = message => {
    let event;
    try { event = JSON.parse(message.data); } catch (error) { setNotice('事件解析失败 · {error}', {error:error.message}); return; }
    if (!followLatest || replayTimer || !hasValue(event.traceId)) return;
    if (event.traceId !== currentTrace) { loadRecent(); return; }
    if (currentEvents.some(e => e.eventId === event.eventId)) return;
    currentEvents.push(event); render();
  };
  source.onerror = () => {
    $('connection').dataset.state = 'error';
    $('connectionText').textContent = tr('重连中');
    setNotice('事件流断开 · 正在自动重连');
  };
}
$('search').oninput = renderHistory;
$('refreshBtn').onclick = loadRecent;
$('followBtn').onclick = () => {
  followLatest = !followLatest;
  if (followLatest) {
    stopReplay();
    if (currentTrace) loadTrace(currentTrace);
    loadRecent();
  }
  syncControls();
};
$('replayBtn').onclick = replay;
$('expandBtn').onclick = () => {
  if (!selectedEvent) return;
  $('dialogTitle').textContent = eventLabel(selectedEvent.eventType) + ' · ' + (selectedEvent.name || '—');
  $('dialogBody').innerHTML = detailHtml(selectedEvent);
  $('copyBtn').textContent = tr('复制');
  $('dialog').showModal();
};
$('closeBtn').onclick = () => $('dialog').close();
$('dialog').onclick = event => { if (event.target === $('dialog')) { const rect = $('dialog').getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) $('dialog').close(); } };
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText($('dialogBody').innerText); $('copyBtn').textContent = tr('已复制'); }
  catch (error) { $('copyBtn').textContent = tr('复制失败'); setNotice('复制失败 · {error}', {error:error.message}); }
};
$('languageBtn').onclick = () => {
  language = language === 'zh' ? 'en' : 'zh';
  localStorage.setItem('feishubot.language', language);
  applyLanguage(); renderHistory(); render();
  if (selectedEvent) $('dialogTitle').textContent = eventLabel(selectedEvent.eventType) + ' · ' + (selectedEvent.name || '—');
};
applyLanguage(); render(); loadRecent(); connect();
setInterval(tickClock, 1000);
setInterval(() => { if (!replayTimer) loadRecent(); }, 6000);
</script>
