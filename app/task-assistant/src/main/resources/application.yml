spring:
  application:
    name: task-assistant

server:
  port: 8080

miniharness:
  # auto: 有本地模型配置(config/openrouter.local.properties)则用 Spring AI 适配器, 否则离线 Noop
  # offline: 强制离线(测试/E2E), 模型调用一律显式拒绝
  model:
    mode: ${MINIHARNESS_MODEL_MODE:auto}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level]【%class{0}】【%method】 %msg%n"
